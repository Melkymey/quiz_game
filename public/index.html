<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{font-family:Arial;background:#1e3c72;color:white;margin:0}
.main{display:flex;padding:80px}
.game{width:60%}
.sidebar{width:40%}
button{display:block;margin:5px;padding:10px}
.correct{background:green}
.wrong{background:red}
</style>
</head>
<body>

<p>👤 <span id="player"></span></p>
<p>⭐ <span id="score">0</span></p>

<div class="main">
<div class="game">
<h2 id="q"></h2>
<div id="a"></div>
</div>

<div class="sidebar">
<h3>🏆</h3>
<ul id="lb"></ul>
<h3>👥</h3>
<ul id="pl"></ul>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="questions.js"></script>

<script>
let socket=io();
let user=localStorage.getItem("username");
if(!user)location.href="login.html";
document.getElementById("player").innerText=user;
socket.emit("join",user);

let questions=[];
let i=0,s=0;

// LOAD HYBRID
async function loadQ(){
  try{
    let r=await fetch("/questions");
    let d=await r.json();
    questions = d.length? d : window.questions;
  }catch{
    questions = window.questions;
  }
  show();
}

function show(){
  let q=questions[i];
  document.getElementById("q").innerText=q.question;
  let a=document.getElementById("a");
  a.innerHTML="";
  q.answers.forEach(ans=>{
    let b=document.createElement("button");
    b.innerText=ans;
    b.onclick=()=>{
      if(ans==q.correct){
        s++;
        document.getElementById("score").innerText=s;
        b.classList.add("correct");
      }else b.classList.add("wrong");
      setTimeout(next,500);
    };
    a.appendChild(b);
  });
}

function next(){
  i++;
  if(i<questions.length)show();
  else finish();
}

async function finish(){
  await fetch("/score",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user,score:s})});
  alert("Skor: "+s);
  loadLB();
}

async function loadLB(){
  let r=await fetch("/leaderboard");
  let d=await r.json();
  let lb=document.getElementById("lb");
  lb.innerHTML="";
  d.forEach(x=>{
    let li=document.createElement("li");
    li.innerText=x.username+"-"+x.score;
    lb.appendChild(li);
  });
}

socket.on("players",p=>{
  let pl=document.getElementById("pl");
  pl.innerHTML="";
  p.forEach(x=>{
    let li=document.createElement("li");
    li.innerText=x.username;
    pl.appendChild(li);
  });
});

loadQ();
loadLB();
</script>
</body>
</html>
