<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="kunci.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#2575fc;
  color:white;
  font-family:Arial;
}

.box{width:300px;text-align:center}
button{display:block;margin:5px;padding:10px;width:100%}
.correct{background:green}
.wrong{background:red}
</style>
</head>

<body>

<div class="box">
<p>⭐ <span id="score">0</span></p>
<p>❤️ <span id="life">3</span></p>
<h3 id="q"></h3>
<div id="a"></div>
</div>

<script src="questions.js"></script>

<script>
let user=localStorage.getItem("username");
if(!user)location.href="menu.html";

let qlist=[],i=0,score=0,life=3;

// load hybrid
async function load(){
  try{
    let r=await fetch("/questions");
    let d=await r.json();
    qlist = d.length?d:window.questions;
  }catch{
    qlist=window.questions;
  }
  show();
}

function show(){
  let q=qlist[i];
  document.getElementById("q").innerText=q.question;
  let a=document.getElementById("a");
  a.innerHTML="";
  q.answers.forEach(ans=>{
    let b=document.createElement("button");
    b.innerText=ans;
    b.onclick=()=>{
      if(ans==q.correct){
        score++;
        document.getElementById("score").innerText=score;
        b.classList.add("correct");
      }else{
        life--;
        document.getElementById("life").innerText=life;
        b.classList.add("wrong");
      }
      setTimeout(next,500);
    };
    a.appendChild(b);
  });
}

function next(){
  i++;
  if(life<=0){
    alert("Game Over");
    location.href="menu.html";
    return;
  }
  if(i<qlist.length)show();
  else finish();
}

async function finish(){
  await fetch("/score",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user,score})});
  alert("Skor: "+score);
  location.href="menu.html";
}

load();
</script>

</body>
</html>
