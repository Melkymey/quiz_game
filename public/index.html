<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Quiz Game</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#4facfe,#00f2fe);
  color: white;
}

/* HEADER (KIRI ATAS) */
.header {
  position: absolute;
  top: 10px;
  left: 15px;
}

.header p {
  margin: 5px 0;
}

/* KONTEN UTAMA */
.main {
  display: flex;
  justify-content: space-between;
  padding: 80px 20px;
}

/* AREA GAME */
.game {
  width: 60%;
}

#answers button {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* SIDEBAR KANAN */
.sidebar {
  width: 35%;
}

.box {
  background: rgba(0,0,0,0.5);
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- 👤 PLAYER INFO (KIRI ATAS) -->
<div class="header">
  <p>👤 <span id="playerName"></span></p>
  <p>⭐ Skor: <span id="score">0</span></p>
</div>

<div class="main">

  <!-- 🎮 GAME -->
  <div class="game">
    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <!-- 📊 KANAN -->
  <div class="sidebar">

    <div class="box">
      <h3>🏆 Leaderboard</h3>
      <ul id="leaderboard"></ul>
    </div>

    <div class="box">
      <h3>👥 Player Online</h3>
      <ul id="players"></ul>
    </div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket = io();

// ambil nama
let user = localStorage.getItem("username");

// kalau belum login
if (!user) {
  window.location.href = "login.html";
}

// tampilkan nama
document.getElementById("playerName").innerText = user;

socket.emit("join", user);

let score = 0;
let questions = [];
let index = 0;

// LOAD SOAL
async function loadQuestions() {
  const res = await fetch("/questions");
  questions = await res.json();
  showQuestion();
}

// TAMPILKAN SOAL
function showQuestion() {
  let q = questions[index];
  document.getElementById("question").innerHTML = q.question;

  let answers = [...q.incorrect_answers, q.correct_answer]
    .sort(() => Math.random() - 0.5);

  let container = document.getElementById("answers");
  container.innerHTML = "";

  answers.forEach(ans => {
    let btn = document.createElement("button");
    btn.innerHTML = ans;

    btn.onclick = () => {
      if (ans === q.correct_answer) {
        score++;
        document.getElementById("score").innerText = score;
      }

      index++;
      if (index < questions.length) {
        showQuestion();
      } else {
        finishGame();
      }
    };

    container.appendChild(btn);
  });
}

// SELESAI
async function finishGame() {
  await fetch("/score", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user,
      score
    })
  });

  alert("Game selesai! Skor: " + score);
  loadLeaderboard();
}

// LEADERBOARD
async function loadLeaderboard() {
  const res = await fetch("/leaderboard");
  const data = await res.json();

  let list = document.getElementById("leaderboard");
  list.innerHTML = "";

  data.forEach(p => {
    let li = document.createElement("li");
    li.innerText = p.username + " - " + p.score;
    list.appendChild(li);
  });
}

// PLAYER ONLINE
socket.on("players", (players) => {
  let list = document.getElementById("players");
  list.innerHTML = "";

  players.forEach(p => {
    let li = document.createElement("li");
    li.innerText = p.username;
    list.appendChild(li);
  });
});

// START
loadQuestions();
loadLeaderboard();
</script>

</body>
</html>
