<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<!-- LOCK -->
<link rel="stylesheet" href="kunci.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Quiz Game</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#fddb3a,#f4c430);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CONTAINER */
.container {
  text-align: center;
}

/* LOGO */
.logo {
  background: white;
  padding: 40px 60px;
  border-radius: 50px;
  font-size: 40px;
  font-weight: bold;
  margin-bottom: 30px;
}

/* INPUT */
input {
  width: 240px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-bottom: 15px;
  text-align: center;
  font-size: 16px;
}

/* BUTTON */
button {
  display: block;
  width: 260px;
  padding: 12px;
  margin: 10px auto;
  border-radius: 15px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  background: white;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 15px;
  width: 300px;
  max-height: 400px;
  overflow: auto;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo">QUIZ</div>

  <!-- INPUT -->
  <input id="username" placeholder="Masukkan nama">

  <!-- PLAY -->
  <button onclick="play()">▶️ PLAY</button>

  <!-- LEADERBOARD -->
  <button onclick="openLeaderboard()">🏆 Top Global Ranking</button>

</div>

<!-- MODAL LEADERBOARD -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>🏆 Top Global</h3>
    <ul id="leaderboard"></ul>
    <button onclick="closeModal()">Tutup</button>
  </div>
</div>

<script>
// ======================
// AUTO ISI NAMA (BONUS)
// ======================
let lastUser = localStorage.getItem("username");
if (lastUser) {
  document.getElementById("username").value = lastUser;
}

// ======================
// PLAY
// ======================
function play() {
  let name = document.getElementById("username").value.trim();

  if (!name) {
    alert("Isi nama dulu!");
    return;
  }

  // SIMPAN USERNAME
  localStorage.setItem("username", name);

  window.location.href = "index.html";
}

// ENTER = PLAY
document.getElementById("username").addEventListener("keypress", function(e){
  if (e.key === "Enter") play();
});

// ======================
// LEADERBOARD
// ======================
async function openLeaderboard() {
  document.getElementById("modal").style.display = "flex";

  let res = await fetch("/leaderboard");
  let data = await res.json();

  let list = document.getElementById("leaderboard");
  list.innerHTML = "";

  data.forEach((p, i) => {
    let li = document.createElement("li");
    li.innerText = (i+1) + ". " + p.username + " - " + p.score;
    list.appendChild(li);
  });
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

// lock gesture tambahan
document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});
</script>

</body>
</html>
