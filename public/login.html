<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Quiz</title>

<style>
body {
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg,#4facfe,#00f2fe);
}

.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
}

input {
  padding: 10px;
  width: 200px;
}

button {
  padding: 10px;
  margin-top: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="box">
  <h1>🧠 Quiz Game</h1>
  <input id="username" placeholder="Masukkan nama">
  <br>
  <button onclick="masuk()">Mulai</button>
</div>

<script>
function masuk() {
  const username = document.getElementById("username").value;

  if (!username) {
    alert("Isi nama dulu!");
    return;
  }

  localStorage.setItem("username", username);
  window.location.href = "index.html";
}
</script>

</body>
</html>
